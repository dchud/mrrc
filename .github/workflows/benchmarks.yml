name: "Benchmarks"

# The Rust and Python CodSpeed benchmarks run as two jobs of this one
# workflow. CodSpeed combines the results of a workflow run into a single
# report, but not across workflows: with one workflow per language, the PR
# report showed only whichever upload finished last.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'LICENSE'
      - '.gitignore'
      - '.beads/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'LICENSE'
      - '.gitignore'
      - '.beads/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dependency bumps don't need the CodSpeed perf gate; skip for dependabot.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write  # OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build benchmarks
        # Allowlist the single-threaded criterion benches. parallel_benchmarks
        # is excluded: Valgrind serializes threads under simulation mode, so
        # rayon speedup cannot be measured there (its sequential baselines
        # duplicate marc_benchmarks' read_* coverage). Run it locally with
        # criterion for real walltime numbers. memory_profile prints a
        # heap-per-record table and produces no CodSpeed signal.
        run: >-
          cargo codspeed build
          --bench marc_benchmarks
          --bench error_handling_benchmarks
          --bench format_benchmarks

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          run: cargo codspeed run
          mode: simulation

  python:
    name: Python benchmarks
    runs-on: ubuntu-22.04  # CodSpeed only supports Ubuntu 20.04/22.04
    timeout-minutes: 30
    # Dependency bumps don't need the CodSpeed perf gate; skip for dependabot.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build mrrc wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          manylinux: off
          args: --release --out dist

      - name: Install mrrc and dependencies
        run: |
          # Install the wheel just built by its path. Installing by name
          # (--find-links dist mrrc) lets uv satisfy the version from its
          # restored cache, which then benchmarks an older build of the same
          # version instead of this commit.
          WHEEL=$(ls dist/*.whl | head -1)
          uv pip install --system "${WHEEL}"
          uv pip install --system pytest pytest-benchmark pytest-codspeed

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          # NOTE: Only enabled if CODSPEED_TOKEN is set as a repo secret
          token: ${{ secrets.CODSPEED_TOKEN }}
          # Simulation mode measures instruction counts under Valgrind:
          # deterministic on standard runners, unlike walltime, which cannot
          # distinguish real regressions from runner-speed variance.
          mode: simulation
          # Parallel-throughput benchmarks are excluded: Valgrind serializes
          # threads, so multi-threaded speedup cannot be measured under
          # simulation. Measure parallel throughput with real walltime runs
          # on controlled hardware instead.
          # Note: Don't use --benchmark-only here; CodSpeed handles benchmarks differently
          run: >-
            pytest tests/python/ -m "benchmark and not slow" -v
            --ignore=tests/python/test_benchmark_parallel.py
            --ignore=tests/python/test_benchmark_pipeline_parallel.py
